# StructTrace - build and test on every push and pull request.
#
# Expects this layout in the repository (adjust WEB and TESTS below if yours differs):
#   StructTrace.Web/     the web project (StructTrace.Web.csproj)
#   StructTrace.Tests/   the unit tests (StructTrace.Tests.csproj)
#   .github/workflows/ci.yml

name: Build and test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  WEB: StructTrace.Web
  TESTS: StructTrace.Tests
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore packages
        run: dotnet restore "$TESTS/$TESTS.csproj"

      - name: Build (warnings shown, errors fail the build)
        run: dotnet build "$TESTS/$TESTS.csproj" --no-restore --configuration Release

      - name: Run the unit tests
        run: >
          dotnet test "$TESTS/$TESTS.csproj" --no-build --configuration Release
          --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Check every visualizer script for syntax errors
        run: |
          find "$WEB/wwwroot" -name "*.js" -not -path "*/lib/*" -print0 \
            | xargs -0 -n1 node --check

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
